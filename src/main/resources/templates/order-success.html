<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<body>
    <main layout:fragment="content" class="shell page-content">
        <div class="result-card">
            <div class="result-icon success-icon" aria-hidden="true">✓</div>
            <span class="eyebrow" th:text="#{order.success.eyebrow}">ORDER RECEIVED</span>
            <h1 th:text="#{order.success.title}">Order placed</h1>
            <p th:text="#{order.success.text}">Your order has been created. Fulfillment continues in the background.</p>
            <a class="button" th:href="@{/}" th:text="#{order.success.action}">Continue shopping</a>
            <a class="subtle-link" th:if="${loggedInUsername != null}" th:href="@{/orders}" th:text="#{order.success.history}">View my orders</a>
        </div>
    </main>
</body>
</html>
