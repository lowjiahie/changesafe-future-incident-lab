<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<body>
    <main layout:fragment="content" class="shell page-content">
        <span class="eyebrow" th:text="#{cart.eyebrow}">YOUR SELECTION</span>
        <h1 th:text="#{cart.title}">Your cart</h1>
        <p class="page-intro" th:text="#{cart.intro}">Review your items before checking out.</p>

        <div th:unless="${#arrays.isEmpty(items)}" class="checkout-grid">
            <div class="surface cart-items">
                <div class="cart-row" th:each="item: ${items}">
                    <div class="cart-item-art" aria-hidden="true">✦</div>
                    <div class="cart-item-info"><h2 th:text="${item.title}">Item</h2>
                        <span th:text="'Qty ' + ${item.quantity}">Qty 1</span></div>
                    <strong th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}">$0.00</strong>
                    <a class="remove-link" th:href="@{/cart/remove(productId=${item.id})}"
                       th:aria-label="|Remove ${item.title} from cart|" th:text="#{cart.remove}">Remove</a>
                </div>
            </div>
            <aside class="surface summary">
                <h2 th:text="#{cart.summary}">Order summary</h2>
                <div class="summary-line"><span th:text="#{cart.subtotal}">Subtotal</span>
                    <strong th:text="${'$' + #numbers.formatDecimal(total, 1, 2)}">$0.00</strong></div>
                <p th:text="#{cart.summary.note}">This is a demo checkout using sample data.</p>
                <a class="button button-full" th:href="@{/order}" th:text="#{cart.place}">Continue to checkout</a>
                <a class="subtle-link" th:href="@{/}" th:text="#{cart.continue}">Continue shopping</a>
            </aside>
        </div>
        <div class="empty-state" th:if="${#arrays.isEmpty(items)}">
            <div class="empty-icon" aria-hidden="true">✦</div>
            <h2 th:text="#{cart.empty.title}">Your cart is empty</h2>
            <p th:text="#{cart.empty.text}">Add something from the catalog to get started.</p>
            <a class="button" th:href="@{/}" th:text="#{cart.empty.action}">Browse products</a>
        </div>
    </main>
</body>
</html>
