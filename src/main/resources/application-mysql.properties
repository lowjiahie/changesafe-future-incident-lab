# Override these values with DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/changesafe?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Seed only missing catalog/stock rows; do not reset existing demo orders.
spring.sql.init.data-locations=classpath:mysql-example-data.sql
